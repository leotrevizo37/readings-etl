[project]
name = "projectA"
requires-python = ">=3.11,<3.14"
version = "0.1.0"
dependencies = [
    "dagster==1.13.26",
    "pyodbc>=5.3.0",
    "pyspark>=4.0.1",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "projectA"
registry_modules = [
    "projectA.components.*",
]



[tool.uv]
constraint-dependencies = [
    "anyio==4.15.1",
    "urllib3==2.8.0",
    "PyJWT==2.15.1",
    "fsspec==2026.9.0",
    "Mako==1.4.3",
    "cryptography==50.0.2",
    "protobuf==6.33.5",
    "starlette==1.9.0",
    "SQLAlchemy==2.1.4",
    "grpcio==1.84.0",
    "grpcio-health-checking==1.81.0",
    "tzdata==2026.5",
]
