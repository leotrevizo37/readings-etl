version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/dagster"
    schedule:
      interval: "weekly"
    target-branch: "development"

  - package-ecosystem: "docker"
    directories:
      - "/dagster"
      - "/spark"
    schedule:
      interval: "weekly"
    target-branch: "development"

  - package-ecosystem: "docker-compose"
    directory: "/compose"
    schedule:
      interval: "weekly"
    target-branch: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "development"
