name: Deploy Staging

on:
  push:
    branches:
      - stage

jobs:
  deploy:
    environment: staging
    concurrency:
      group: data-etls-staging
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - Linux
      - X64
      - staging-deploy

    steps:
      - name: Deploy on VM
        shell: bash
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
        run: |
          set -euo pipefail
          
          cd /home/warehouse/readings-etl
          git fetch origin
          git reset --hard origin/stage

          test -n "${STAGING_ENV_FILE:-}"

          umask 077
          printf '%s\n' "$STAGING_ENV_FILE" > compose/.env.next

          docker compose \
            --env-file compose/.env.next \
            -f compose/docker-compose.yml \
            -f compose/docker-compose.staging.yml \
            config --quiet

          cp compose/.env compose/.env.backup 2>/dev/null || true
          mv compose/.env.next compose/.env

          docker compose \
            --env-file compose/.env \
            -f compose/docker-compose.yml \
            -f compose/docker-compose.staging.yml \
            up -d --build
