name: ci-python.yml

on:
  push:
    branches:
      - development
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  python:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.head_ref, 'init/') || startsWith(github.head_ref, 'feat/') || github.head_ref == 'stage'
    defaults:
      run:
        working-directory: dagster
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: dagster/requirements.txt

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install ruff==0.16.0 pytest
          pip install -e projectA
          pip install -e projectB
          pip install -e projectC
          pip install -e projectD

      - name: Ruff
        run: ruff check --select E4,E7,E9,F .

      - name: Tests
        run: |
          pytest -q || code=$?
          if [ "${code:-0}" -eq 5 ]; then
            echo "No tests collected (exit code 5). Skipping."
            exit 0
          fi
          exit "${code:-0}"
