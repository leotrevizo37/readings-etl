name: lint-sql.yml

on:
  push:
    branches:
      - development
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || startsWith(github.head_ref, 'init/') || startsWith(github.head_ref, 'feat/') || startsWith(github.head_ref, 'fix/')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install -U pip
          pip install sqlfluff==4.3.0 yamllint==1.35.1

      - name: SQLFluff
        run: >
          sqlfluff lint sql
          --dialect tsql
          --exclude-rules CP02,RF04,LT05

      - name: Yamllint
        run: |
          yamllint -f parsable \
            -d "{extends: default, rules: {line-length: disable, truthy: disable, document-start: disable}}" \
            sql
      
