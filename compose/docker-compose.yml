x-dagster-common: &dagster_common
  env_file:
    - .env
  environment:
    DAGSTER_HOME: /opt/dagster/dagster_home
  working_dir: /opt/dagster/app
  volumes:
    - ../dagster/dagster_home:/opt/dagster/dagster_home
    - ../dagster/projectA:/opt/dagster/app/projectA
    - ../dagster/projectB:/opt/dagster/app/projectB
    - ../dagster/projectC:/opt/dagster/app/projectC
    - ../dagster/projectD:/opt/dagster/app/projectD
    - ../workspace.yaml:/opt/dagster/app/workspace.yaml:ro
    - spark-data:/data
  networks:
    - data-dagster
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  sql-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: data-sql-init
    env_file:
      - .env
    networks:
      - data-dagster
    volumes:
      - ../sql/init:/sql/init:ro
      - ../sql/procedures:/sql/procedures:ro
      - ../sql/user_codes:/sql/user_codes:ro
    command:
      - sh
      - -c
      - |
          set -eu

          SQLCMD=/opt/mssql-tools/bin/sqlcmd
          SQLCMD_LOG=$$(mktemp)
          trap 'rm -f "$$SQLCMD_LOG"' EXIT

          run_sql() {
            sql_status=0
            "$$SQLCMD" "$$@" >"$$SQLCMD_LOG" 2>&1 || sql_status=$$?
            cat "$$SQLCMD_LOG"
            if [ "$$sql_status" -ne 0 ]; then
              return "$$sql_status"
            fi
            if grep -Eq '^SqlState [0-9A-Z]{5},|^Sqlcmd: Error:' "$$SQLCMD_LOG"; then
              echo "SQL client reported an error despite returning success." >&2
              return 1
            fi
          }

          echo "Waiting for SQL Server at $${MSSQL_HOST}:$${MSSQL_PORT:-1433}..."
          until "$$SQLCMD" \
                    -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                    -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                    -Q "SELECT 1" >/dev/null 2>&1; do
            echo "SQL Server not ready, retrying in 5s..."
            sleep 5
          done

          USER_CODE_DBS="$${USER_CODE_DBS:-projectA=projectA projectB=projectB projectD=projectD}"

          for db_spec in $$USER_CODE_DBS; do
            case "$$db_spec" in
              *=*)
                USER_CODE="$${db_spec%%=*}"
                APP_DB="$${db_spec#*=}"
                ;;
              *)
                USER_CODE="$$db_spec"
                APP_DB="$$db_spec"
                ;;
            esac

            if [ -z "$$USER_CODE" ] || [ -z "$$APP_DB" ]; then
              echo "Invalid USER_CODE_DBS entry: '$$db_spec'"
              exit 1
            fi

            APP_DB_SQLSTRING=$$(printf "%s" "$$APP_DB" | sed "s/'/''/g")
            APP_DB_IDENTIFIER=$$(printf "%s" "$$APP_DB" | sed "s/]/]]/g")

            echo "Ensuring database $$APP_DB exists for user_code $$USER_CODE..."
            run_sql \
                -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                -d master \
                -b \
                -Q "IF DB_ID(N'$$APP_DB_SQLSTRING') IS NULL EXEC(N'CREATE DATABASE [$$APP_DB_IDENTIFIER]');"

            echo "Running SQL init scripts for $$USER_CODE from /sql/init and /sql/procedures..."
            for f in /sql/init/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              run_sql \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done

            for f in /sql/procedures/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              run_sql \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done

            for f in /sql/user_codes/"$$USER_CODE"/init/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              run_sql \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done

            for f in /sql/user_codes/"$$USER_CODE"/procedures/*.sql; do
              [ -e "$$f" ] || continue
              echo "==> [$$APP_DB] $$f"
              run_sql \
                  -S "$${MSSQL_HOST},$${MSSQL_PORT:-1433}" \
                  -U "$${MSSQL_USER}" -P "$${MSSQL_PASSWORD}" \
                  -d"$$APP_DB" \
                  -b -i "$$f"
            done
          done

          echo "SQL init completed."
    restart: "no"

  dagster-postgres:
    image: postgres:18
    container_name: data-dagster-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DAGSTER_PG_USER}
      POSTGRES_PASSWORD: ${DAGSTER_PG_PASSWORD}
      POSTGRES_DB: ${DAGSTER_PG_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    networks:
      - data-dagster
    depends_on:
      sql-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DAGSTER_PG_USER} -d ${DAGSTER_PG_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dagster-user-code-projectA:
    build:
      context: ..
      dockerfile: dagster/Dockerfile
    container_name: projectA-dagster-user-code
    <<: *dagster_common
    depends_on:
      sql-init:
        condition: service_completed_successfully
    working_dir: /opt/dagster/app/projectA
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      PYTHONPATH: /opt/dagster/app/projectA/src
      SPARK_DRIVER_HOST: projectA-dagster-user-code
      SPARK_DRIVER_BIND_ADDRESS: 0.0.0.0
      APP_DB: ${PROJECTA_DB:-projectA}
      DIM_DB: ${PROJECTA_DIM_DB:-projectA}
      ADLS_CONTAINER_NAME: ${PROJECTA_ADLS_CONTAINER_NAME:-projectA}
      FACTREADINGS_OVERLAP_HOURS: ${PROJECTA_DEFAULT_FACTREADINGS_OVERLAP_HOURS:-12}
      MSSQL_HOST: ${MSSQL_HOST}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_USER: ${MSSQL_USER}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD}
      FACTREDINGSAUDITS_OVERLAP_HOURS: ${PROJECTA_DEFAULT_FACTREDINGSAUDITS_OVERLAP_HOURS:-1}
      CHIRPSTACK_API_URL: ${PROJECTA_CHIRPSTACK_API_URL:-}
      CHIRPSTACK_API_TOKEN: ${PROJECTA_CHIRPSTACK_API_TOKEN:-}
      CHIRPSTACK_API_TIMEOUT_SECONDS: ${PROJECTA_CHIRPSTACK_API_TIMEOUT_SECONDS:-}
      CHIRPSTACK_API_PAGE_SIZE: ${PROJECTA_CHIRPSTACK_API_PAGE_SIZE:-}
      MQTT_EVENT_HISTORY_API_URL: ${PROJECTA_MQTT_EVENT_HISTORY_API_URL:-}
      MQTT_EVENT_HISTORY_API_USER: ${PROJECTA_MQTT_EVENT_HISTORY_API_USER:-}
      MQTT_EVENT_HISTORY_API_PASSWORD: ${PROJECTA_MQTT_EVENT_HISTORY_API_PASSWORD:-}
      MQTT_EVENT_HISTORY_API_TIMEOUT_SECONDS: ${PROJECTA_MQTT_EVENT_HISTORY_API_TIMEOUT_SECONDS:-60}
      MQTT_EVENT_HISTORY_API_LIMIT: ${PROJECTA_MQTT_EVENT_HISTORY_API_LIMIT:-5000}
      MQTT_EVENT_HISTORY_API_REQUESTS_PER_MINUTE: ${PROJECTA_MQTT_EVENT_HISTORY_API_REQUESTS_PER_MINUTE:-95}
      MQTT_EVENT_HISTORY_LOOKBACK_HOURS: ${PROJECTA_MQTT_EVENT_HISTORY_LOOKBACK_HOURS:-6}
      MQTT_EVENT_HISTORY_REJECTED_ROW_RETENTION_DAYS: ${PROJECTA_MQTT_EVENT_HISTORY_REJECTED_ROW_RETENTION_DAYS:-30}
      SPARK_DF_IO_BASE_PATH: ${PROJECTA_SPARK_DF_IO_BASE_PATH:-/data/dagster_io/spark_dfs/projectA}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:${SPARK_MASTER_PORT:-7077}}
      SPARK_MASTER_STATUS_URL: http://data-spark-master:8080/json/
      DIMSQL_HOST: ${PROJECTA_DIMSQL_HOST:-${DIMSQL_HOST}}
      DIMSQL_PORT: ${PROJECTA_DIMSQL_PORT:-${DIMSQL_PORT:-1433}}
      DIMSQL_USER: ${PROJECTA_DIMSQL_USER:-${DIMSQL_USER}}
      DIMSQL_PASSWORD: ${PROJECTA_DIMSQL_PASSWORD:-${DIMSQL_PASSWORD}}
      SPARK_OBSERVABILITY_DRIVER_PORT: ${PROJECTA_OBSERVABILITY_SPARK_DRIVER_PORT:-37124}
      SPARK_OBSERVABILITY_DRIVER_BLOCK_MANAGER_PORT: ${PROJECTA_OBSERVABILITY_SPARK_BLOCK_MANAGER_PORT:-37125}
      SPARK_OBSERVABILITY_BLOCK_MANAGER_PORT: ${PROJECTA_OBSERVABILITY_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37126}
      SPARK_DRIVER_PORT: ${PROJECTA_SPARK_DRIVER_PORT}
      SPARK_DRIVER_BLOCK_MANAGER_PORT: ${PROJECTA_SPARK_BLOCK_MANAGER_PORT}
      SPARK_BLOCK_MANAGER_PORT: ${PROJECTA_SPARK_EXECUTOR_BLOCK_MANAGER_PORT:-37129}
      SPARK_WORKER_NETWORK_TIMEOUT_SECONDS: ${SPARK_WORKER_NETWORK_TIMEOUT_SECONDS:-3}
    ports:
      - "${PROJECTA_USER_CODE_PORT:-4001}:4001"
    command: [
      "dagster", "api", "grpc",
      "-h", "0.0.0.0",
      "-p", "4001",
      "-m", "projectA.definitions"
    ]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "dagster api grpc-health-check -p 4001 -h 127.0.0.1"
        ]
      interval: 20s
      timeout: 25s
      retries: 10
      start_period: 20s

