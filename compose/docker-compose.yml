    image: prom/prometheus:v3.15.0
    container_name: data-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets.yml:/etc/prometheus/targets.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - data-dagster
    depends_on:
      blackbox-exporter:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  spark-master:
    user: "0:0"
    build:
      context: ..
      dockerfile: spark/Dockerfile
    container_name: data-spark-master
    depends_on:
      spark-data-init:
        condition: service_completed_successfully
    command: [
      "/opt/spark/bin/spark-class",
      "org.apache.spark.deploy.master.Master"
    ]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
    volumes:
      - spark-data:/data
    restart: unless-stopped
    networks:
      - data-dagster
    healthcheck:
      test: [
        "CMD-SHELL",
        "python3 -c 'import os,socket; host=os.popen(\"hostname -i\").read().strip().split()[0]; s=socket.socket(); s.settimeout(2); s.connect((host,7077)); s.close()'"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  spark-worker:
    user: "0:0"
    build:
      context: ..
      dockerfile: spark/Dockerfile
    depends_on:
      spark-master:
        condition: service_started
      spark-data-init:
        condition: service_completed_successfully
    environment:
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEM}
    command:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077"
      ]
    volumes:
      - spark-data:/data
    networks:
      - data-dagster
    restart: unless-stopped

  spark-data-init:
    image: alpine:3.23
    user: "0:0"
    container_name: spark-data-init
    volumes:
      - spark-data:/data
    command: ["sh", "-c", "mkdir -p /data/dagster_io/spark_dfs && chmod -R 777 /data"]
    restart: "no"
    networks:
      - data-dagster

volumes:
  spark-data:
  dagster_postgres_data:
  prometheus_data:

networks:
  data-dagster:
    driver: bridge
