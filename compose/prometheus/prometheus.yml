global:
  scrape_interval: 60s
  scrape_timeout: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: blackbox_probe
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.yml
        refresh_interval: 1m
    relabel_configs:
      - source_labels:
          - __address__
        regex: https?://.+
        target_label: __param_module
        replacement: http_2xx
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - source_labels:
          - __param_target
        regex: (https?://)(localhost|127\.0\.0\.1)(.*)
        target_label: __param_target
        replacement: ${1}host.docker.internal${3}
      - source_labels:
          - __param_target
        regex: (localhost|127\.0\.0\.1)(:.*)
        target_label: __param_target
        replacement: host.docker.internal${2}
      - target_label: __address__
        replacement: blackbox-exporter:9115
